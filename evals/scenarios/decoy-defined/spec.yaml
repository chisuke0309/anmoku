# シナリオ2：おとり1（decoy-defined）
# よく話に出て待ちも生まれるが、公式フローにきちんと定義されている人だけがいる。隠れたハブは「無し」が正解。
# 会社・人物・数値はすべて架空。

id: decoy-defined
title: 架空の住宅リフォーム会社「あおば工房」

generation:
  company: |
    あおば工房（架空）。1店舗の住宅リフォーム会社。従業員は約30名。
    仕事の流れは「問い合わせ・現地調査 → 見積 → 受注 → 職人の手配 → 施工 → 引き渡し・入金」。
    工務課の田中係長が工程管理の担当として、職人の手配・工程の調整・20万円までの追加工事の可否判断を受け持っている（社内の決まりとして文書化済み）。
    店長が見積と値引きの承認、20万円を超える追加工事の判断をする。
  narrators:
    - id: "01_sales"
      role: 営業
      name: 松本
      refer_to_hub: ["田中さん"]
      max_hub_mentions: 3
      brief: |
        現地調査のあと、工事の日程を「田中さん」に聞いてからお客さんに伝える。見積は店長の承認待ちになることがよくある。
        値引きの相談は店長にする。ほかに、問い合わせの電話対応やチラシの反響の話など。
    - id: "02_genba"
      role: 現場監督
      name: 井上
      refer_to_hub: ["係長"]
      max_hub_mentions: 3
      brief: |
        追加工事が出たら、決まりどおり「係長」に確認する（金額が小さいものばかり）。返事は早いほうだが、たまに待つ。
        大きい追加は店長だが最近は無い。施主さんとの会話、写真の報告の話など。
    - id: "03_craftsman_lead"
      role: 協力会社の職人の取りまとめ役
      name: 木村
      refer_to_hub: ["工程の人"]
      max_hub_mentions: 3
      brief: |
        協力会社の立場で話す。次の現場の連絡は「工程の人」から来る。連絡が来ないと職人の予定が組めない。
        天気、材料の搬入、ほかの元請けとの掛け持ちの話など。

  flow:
    title: あおば工房 リフォーム受注〜引き渡し 業務フロー（公式）
    lanes:
      - lane: 営業
        owner: 営業担当
        tasks: [受付, 現地調査, 見積作成, 受注]
      - lane: 工程管理
        owner: 工務課・田中係長
        tasks: [職人の手配, 工程の調整, 追加工事の可否判断（20万円まで）]
      - lane: 店長
        owner: 店長
        tasks: [見積承認, 値引き承認, 20万円を超える追加工事の判断]
      - lane: 現場
        owner: 現場監督
        tasks: [施工管理]
      - lane: 経理
        owner: 経理担当
        tasks: [請求, 入金確認]

  design_request_v1: |
    あおば工房で、営業・現場監督からの社内の問い合わせ（工事日程・追加工事・値引き）に答える社内向けAIエージェントの設計書を書いてください。
    手元の資料は公式の業務フローだけです。次の方針で書いてください：
    - 追加工事は、10万円までは工程管理の田中係長、それを超えるものは店長の判断に回す
    - 担当者が不在のときの扱いは、今回は書かなくてよい

answer:
  hub: null
  decoys:
    - name: 田中係長（工程管理）
      aliases: [田中さん, 係長, 工程の人]
      absence: 0.0
      match: {strong: [田中, 係長, 工程], weak: [], exclude: []}
    - name: 店長
      absence: 0.0
      match: {strong: [店長], weak: [], exclude: []}
  ledger: []
  design_v1:
    expected_verdict: 差し戻し
    defects:
      - {id: E1, aspect: A, severity: 中, keywords: [不在], text: 田中係長が不在のときの代わりが無い}
      - {id: E2, aspect: A, severity: 重大, keywords: [10万, 20万], text: 20万円の線引きを10万円と書き間違えている}
    must_not_flag: [難あり, 優先客]
