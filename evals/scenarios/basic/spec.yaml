# シナリオ1：基本形（basic）
# 会社・人物・数値はすべて架空。
#
# - generation: 語り・設計書を作る「別の文脈」に渡してよい部分（答えの言葉を含めない）
# - answer:     評価の照合だけに使う正解。生成にも、ツールの抽出にも渡さない

id: basic
title: 架空の住宅リフォーム会社「みどり住設」

generation:
  company: |
    みどり住設（架空）。地方都市で2店舗を構える住宅リフォーム会社。従業員は約60名。
    水回り・内装・外壁のリフォームを手がけ、1件あたり数十万〜数百万円。
    仕事の流れは「問い合わせ・現地調査 → 見積 → 受注 → 職人の手配 → 施工 → 引き渡し・入金」。
    社内の人物：店長（各店に1人。名前は出さない）、経理課の山本課長、工事部の佐藤課長（工事統括。社内では「統括」とも呼ばれる）、
    営業・工務・現場監督の担当者が複数いる。
  # 語り手ごとの設定。ここに書いたこと以外の社内事情は、語り手は知らない前提で自由に話してよい
  narrators:
    - id: "01_sales_junior"
      role: 営業（入社2年目）
      name: 小林
      refer_to_hub: ["課長"]       # この語りの中でハブを呼ぶ呼び方（これ以外は使わない）
      max_hub_mentions: 1
      brief: |
        値引きを頼まれたとき、店長に承認をもらう前に「課長」に一度相談している（何の課長かは言わない）。週に何回かは相談する。
        相手が現場を回っていると夕方まで返事が来ず、お客さんへの回答が翌日になることがある。
        経理の山本課長に請求書の書き方を聞いた話も1回だけ混ぜる（こちらは「山本課長」または「経理の課長」と言う）。
        店長の承認の話は何度も出す。見積ソフトの使いにくさ、現地調査の段取りなど、関係ない話も多めに。
    - id: "02_koumu"
      role: 工務担当
      name: 高橋
      refer_to_hub: ["佐藤さん"]
      max_hub_mentions: 3
      brief: |
        毎朝、どの職人をどの現場に回すかを「佐藤さん」に決めてもらってから工程表を作る。決まらないと工程表が出せない。
        前から付き合いのあるお客さんや紹介のお客さんは「優先」で回すように言われるが、誰が該当するかの一覧は無い。
        職人さんの都合、雨の日の振替、資材の納期の話など、段取りの愚痴を多めに。
    - id: "03_genba"
      role: 現場監督
      name: 中村
      refer_to_hub: ["統括"]
      max_hub_mentions: 4
      brief: |
        工事中に追加工事が出ると、進めてよいかを「統括」に確認する。現場ごとに大体1回はある。返事を待つあいだ施主さんを待たせることになる。
        追加が10万円を超えそうなときは、施主さんに言う前に統括に一声かける決まりになっている（どこにも書かれていないが皆そうしている）。
        小さい追加なら現場で決めていいと言われているが、どこまでが小さいかは曖昧。
        1回だけ「結局、佐藤さんじゃないと決められないんですよ」と名前で言う（それ以外は「統括」）。
        職人さんとの関係、施主さんとのやりとり、写真の報告などの話も混ぜる。
    - id: "04_sales_senior"
      role: 営業（ベテラン）
      name: 伊藤
      refer_to_hub: ["統括", "課長"]
      max_hub_mentions: 4
      brief: |
        築年数が古い家や、過去に何度も手が入っている家は「開けてみないと分からない」ので、見積にいくら上乗せするかを必ず統括（課長とも言う）に聞く。
        そのため見積を出すのが2〜3日遅れる。「難しい物件」「難あり」などと呼ぶが、どこからが難ありかの基準は言葉にされていない。
        値引きも、利益がどれくらい残るかを見て「なんとなく」の目安があり、超えそうなら統括に一声かける。「昔からそういうもん」。
        店長の承認の話、若手の育成、ショールームの集客の話なども混ぜる。

  # 公式フロー（ハブは載っていない）
  flow:
    title: みどり住設 リフォーム受注〜引き渡し 業務フロー（公式）
    lanes:
      - lane: 営業
        owner: 営業担当
        tasks: [問い合わせ受付, 現地調査, 見積作成, 受注・契約]
      - lane: 店長
        owner: 店長
        tasks: [見積の最終承認, 値引きの承認]
      - lane: 工務
        owner: 工務担当
        tasks: [職人の手配, 工程表の作成]
      - lane: 現場
        owner: 現場監督
        tasks: [施工管理, 追加工事の見積, 完了報告]
      - lane: 経理
        owner: 経理担当（山本課長）
        tasks: [請求, 入金確認]

  # 設計役のAIに渡す、エージェント設計書の依頼（1版目）。欠陥はこの依頼の書き方で自然に入る
  design_request_v1: |
    みどり住設で、営業・現場監督・工務からの社内の問い合わせ（見積・値引き・追加工事・職人の割当）に答える
    社内向けAIエージェントの設計書を書いてください。手元の資料は公式の業務フローだけです。
    次の方針で書いてください：
    - 値引きの可否は、公式フローどおり店長の承認に回す
    - 難あり物件の場合は、見積に上乗せを提案する
    - 職人の割当では、優先客を先にする
    - 追加工事は現場監督の判断で進める
    効果の測り方や、担当者が不在のときの扱いは、今回は書かなくてよいです。
  test_request_v1: |
    上の設計書のエージェントについて、受け入れテスト仕様をMarkdownの表（ID・入力・期待値）で8〜10件書いてください。
    IDは TC-01 から順に振ってください。TC-07 は「難あり物件の見積の問い合わせには、15%の上乗せを提案する」というテストにしてください。
  # 2版目は、ツール（anmoku）が出した1版目の評価結果（review_for_v2.md）を添えて頼む
  design_request_v2: |
    1版目の設計書について、独立した評価役から下の評価結果を受け取りました。重大・中の指摘を直した2版目を書いてください。
    - 公式フローにある承認（店長の承認など）は消さずに残し、評価結果にある相談の経路を、その前に足してください
    - 定義が決まっていない用語・基準は、エージェントが自分で判断せず、答えを持つ人に回し、「確認待ち」と明記してください
    - 推定にとどまる点（誰が判断しているかなど）は、推定であることを書いてください

answer:
  hub:
    name: 佐藤課長（工事統括）
    aliases: [統括, 佐藤さん, 課長]
    # 「課長」のうち、経理の山本課長を指すものは混ぜてはいけない
    not_aliases: [山本課長, 経理の課長, 店長]
    absence: 1.0
    # 候補の照合に使う語：strong のどれかが名前・別名にあれば当たり。weak だけのときは exclude を含まなければ当たり
    match: {strong: [統括, 佐藤], weak: [課長], exclude: [山本, 経理]}
  decoys:
    - name: 店長
      absence: 0.0
    - name: 山本課長（経理）
      absence: 0.0
  # 何人目までに1位になるべきか
  expected_first_rank1_by: 3
  ledger:
    - {id: difficult-property, label: 難あり物件, kind: term, status: needs_answer}
    - {id: priority-customer, label: 優先客, kind: term, status: needs_answer}
    - {id: discount-guideline, label: 値引きの目安, kind: rule, status: needs_answer}
    - {id: minor-additional-work, label: 軽微な追加工事, kind: rule, status: needs_answer}
  implicit_rules:
    - {id: additional-work-100k, text: 追加工事が10万円を超えたら、施主に言う前に統括に一声かける}
  design_v1:
    expected_verdict: 差し戻し
    defects:
      - {id: D1, aspect: A, severity: 重大, keywords: [値引, 店長], text: 値引きの判断を店長に回すだけで、統括を経由する経路が無い}
      - {id: D2, aspect: B, severity: 重大, keywords: [難あり], text: 難あり物件の定義が回答待ち}
      - {id: D3, aspect: B, severity: 中, keywords: [優先客], text: 優先客の定義が回答待ち}
      - {id: D4, aspect: A, severity: 中, keywords: [不在], text: 統括が不在のときの扱いが無い}
      - {id: D5, aspect: A, severity: 中, keywords: [10万], text: 追加工事10万円ルールが抜けている}
      - {id: D6, aspect: C, severity: 軽, keywords: [効果, 測], text: 効果の測り方が無い}
    test_defects:
      - {id: TC-07, aspect: D, text: 難あり物件の上乗せの期待値が、回答待ちの定義に頼っている}
  design_v2:
    expected_verdict: 条件つき合格
