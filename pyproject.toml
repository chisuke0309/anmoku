[project]
name = "anmoku"
version = "0.1.0"
description = "ヒアリングの語りから、業務フローに定義されていない役割（隠れたハブ）を仮説として見つける評価ツール"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyyaml>=6.0"]

[project.scripts]
anmoku = "anmoku.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anmoku"]

[tool.pytest.ini_options]
testpaths = ["tests"]
