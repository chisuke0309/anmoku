id: small-additional-work-limit
label: 小さい追加工事の上限(現場判断と一声かけの基準)
kind: rule
definition: 十万円を超えそうなときは、施主に伝える前に先輩・上の人へ一声かける。それ以下の小さい追加は現場で判断してよいとされるが、「小さい」の範囲は人により感覚が異なる(三万〜五万なら可、と受け止めている例あり)。
status: draft
owner_hint: 工事統括の課長（佐藤さん）
evidence:
- source: interviews/03_genba.md
  line: 30
  quote: 小さい追加なら現場で決めていいって言われてるんです。
  speaker: 中村
- source: interviews/03_genba.md
  line: 26
  quote: 十万を超えそうなときは、施主さんに言う前に一声かけるっていう。
  speaker: 中村
- source: interviews/03_genba.md
  line: 30
  quote: その「小さい」がどこまでなのか、正直よくわかんなくて。
  speaker: 中村
- source: interviews/03_genba.md
  line: 34
  quote: ちょっとでも怪しいと思ったら聞くようにしてます
  speaker: 中村
- source: interviews/03_genba.md
  line: 32
  quote: 三万とか五万とかなら、まあいいかなって。
  speaker: 中村
questions:
- 現場で決めてよい追加工事は、金額・内容でどこまでですか。十万円は合計・一件のどちらで見ますか。
- 十万円未満でも必ず事前に相談すべき例(下地・配管など)はありますか。
- 一声かける相手は誰で、どの手段(電話・チャット等)で、事後報告はどこまで許されますか。
