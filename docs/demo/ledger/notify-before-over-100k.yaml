id: notify-before-over-100k
label: 十万円を超えそうな追加は施主に言う前に一声かける
kind: rule
definition: 現場で追加工事が十万円を超えそうなときは、施主に伝える前に先輩へ一声かける。
status: draft
owner_hint: 工事統括の課長（佐藤さん）
