id: priority-customer
label: 優先のお客さん・絶対ずらせない日・指名職人
kind: rule
definition: 前から付き合いのあるお客さんや紹介のお客さんは、工程調整で優先する。ただし一覧は無く、指名職人や動かせない日の条件も営業側の頭の中にある。
status: draft
owner_hint: 工事統括の課長（佐藤さん）
evidence:
- source: interviews/02_koumu.md
  line: 14
  quote: 前から付き合いのあるお客さんとか、紹介で来たお客さんは、優先で回せって言われてる
  speaker: 高橋
- source: interviews/02_koumu.md
  line: 16
  quote: 一覧とかは無いんですよ
  speaker: 高橋
- source: interviews/02_koumu.md
  line: 26
  quote: この職人さんじゃないと、みたいなのがあるみたい
  speaker: 高橋
- source: interviews/02_koumu.md
  line: 34
  quote: 絶対ずらせない日があったりするんで
  speaker: 高橋
- source: interviews/02_koumu.md
  line: 32
  quote: 玉突きのどこを先にするかって、結局また聞かないと決められなくて
  speaker: 高橋
questions:
- 優先するお客さんはどう見分け、誰がどこに記録していますか。
- 「この職人でないと」「ずらせない日」はどう把握し、どこに共有しますか。
- 工程が玉突きになるとき、どの順で調整し、誰が決めますか。
