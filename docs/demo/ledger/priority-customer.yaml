id: priority-customer
label: 優先のお客さん
kind: rule
definition: 前から付き合いのあるお客さんや紹介で来たお客さんは、工程の手配で優先して回す。
status: draft
owner_hint: 工事統括の課長（佐藤さん）
evidence:
- source: interviews/02_koumu.md
  line: 14
  quote: 前から付き合いのあるお客さんとか、紹介で来たお客さんは、優先で回せって言われてる
  speaker: 高橋
- source: interviews/02_koumu.md
  line: 16
  quote: 一覧とかは無いんですよ
  speaker: 高橋
questions:
- 優先の対象は「付き合いのある」「紹介」以外にありますか。どの範囲から優先としますか。
- 優先を誰がどう伝え、一覧が無い中で後任はどう見分ければよいですか。
- 優先のお客さんと他の工程が重なったときは、どちらを優先しますか。
