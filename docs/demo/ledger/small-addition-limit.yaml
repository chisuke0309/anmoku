id: small-addition-limit
label: 現場で決めて良い「小さい追加」の範囲
kind: rule
definition: 十万円を超えそうなときは施主に伝える前に先輩へ一声かける。三万〜五万円程度なら現場判断で良いと受け止められている。ただし「小さい」の上限は本人も曖昧。
status: draft
owner_hint: 工事統括の課長（佐藤さん）
evidence:
- source: interviews/03_genba.md
  line: 30
  quote: 小さい追加なら現場で決めていいって言われてるんです。
  speaker: 中村
- source: interviews/03_genba.md
  line: 26
  quote: 十万を超えそうなときは、施主さんに言う前に一声かけるっていう。
  speaker: 中村
- source: interviews/03_genba.md
  line: 30
  quote: その「小さい」がどこまでなのか、正直よくわかんなくて。
  speaker: 中村
- source: interviews/03_genba.md
  line: 34
  quote: ちょっとでも怪しいと思ったら聞くようにしてます
  speaker: 中村
- source: interviews/03_genba.md
  line: 32
  quote: 三万とか五万とかなら、まあいいかなって。
  speaker: 中村
questions:
- 現場判断で追加して良い「小さい追加」は、金額の上限と内容の範囲をどう決めていますか。
- 十万円を超えそうなときは誰に一声かけるのが正しいですか。金額以外に相談が必要になる条件はありますか。
- 怪しいと感じて聞いた方が良いケースには、どんな例がありますか。
