  line: 14
  quote: 前から付き合いのあるお客さんとか、紹介で来たお客さんは、優先で回せって言われてる
  speaker: 高橋
- source: interviews/02_koumu.md
  line: 16
  quote: 一覧とかは無いんですよ
  speaker: 高橋
questions:
- 優先の指示は誰が出し、どう共有されていますか。
- 優先対象を一覧や目印で見分けられるようにするには、何が必要ですか。
