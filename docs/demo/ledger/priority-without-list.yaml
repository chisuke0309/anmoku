id: priority-without-list
label: 付き合いのある・紹介のお客さんは優先して工程を回す
kind: rule
definition: 前から付き合いのあるお客さんや紹介のお客さんは優先で回すよう言われているが、一覧はない。
status: draft
owner_hint: 工事統括の課長（佐藤さん）
evidence:
