id: priority-customer-and-schedule
label: 優先のお客さん・絶対ずらせない日・指名職人
kind: rule
definition: 前から付き合いのあるお客さんや紹介のお客さんは優先して工程を回す。ただし一覧はなく、範囲は人の頭の中にある。
status: draft
owner_hint: 工事統括の課長（佐藤さん）
evidence:
- source: interviews/02_koumu.md
  line: 14
  quote: 前から付き合いのあるお客さんとか、紹介で来たお客さんは、優先で回せって言われてる
  speaker: 高橋
- source: interviews/02_koumu.md
  line: 16
  quote: 一覧とかは無いんですよ
  speaker: 高橋
- source: interviews/02_koumu.md
  line: 26
  quote: この職人さんじゃないと、みたいなのがあるみたい
  speaker: 高橋
- source: interviews/02_koumu.md
  line: 34
  quote: 絶対ずらせない日があったりするんで
  speaker: 高橋
- source: interviews/02_koumu.md
  line: 32
  quote: 玉突きのどこを先にするかって、結局また聞かないと決められなくて
  speaker: 高橋
questions:
- 優先するお客さんの範囲（付き合いの長さ、紹介の扱いなど）と、優先する順位はどう決めていますか。
- 絶対にずらせない日や、特定の職人でないと困る案件は、どう見分けていますか。
- 工程が玉突きになったとき、どれを先に動かすか、何を基準に決めていますか。
