<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anmoku — 定義されていない役割の仮説</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2a3340; --text:#e6edf3; --muted:#8b97a6;
  --accent:#ff9f43; --accent2:#ffd166; --hot:#ff5d5d; --ok:#4cc38a; --chip:#263140; --chipnew:#ffb703;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
header{padding:18px 28px 10px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:22px;letter-spacing:.04em}
header h1 b{color:var(--accent)}
header .sub{color:var(--muted)}
.hyp{margin-left:auto;background:#3a2a10;color:var(--accent2);border:1px solid #6b4b14;padding:4px 10px;border-radius:6px;font-size:13px}
main{display:grid;grid-template-columns:260px 1fr 380px;gap:18px;padding:18px 28px}
@media (max-width:1100px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h2{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600;letter-spacing:.05em}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;align-items:center;padding:8px 6px;border-radius:8px;color:var(--muted);transition:all .3s}
.steps li .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:13px}
.steps li.done{color:var(--text)}
.steps li.done .n{background:var(--chip);border-color:#3b4a5e}
.steps li.cur{background:var(--panel2);color:var(--text)}
.steps li.cur .n{background:var(--accent);color:#1b1206;border-color:var(--accent);font-weight:700}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
button{font:inherit;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer}
button.primary{background:var(--accent);color:#1b1206;border-color:var(--accent);font-weight:700;grid-column:1 / -1;order:-1;padding:12px;font-size:16px}
button:disabled{opacity:.4;cursor:default}
.lanes{margin-top:16px;font-size:12px;color:var(--muted)}
.lanes span{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin:2px 2px 0 0}
#board{position:relative;min-height:600px}
.stagehead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.stagehead .big{font-size:20px;font-weight:700}
.stagehead .muted{color:var(--muted)}
.row{position:absolute;left:0;right:0;height:96px;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s;cursor:pointer}
.card{height:88px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:34px 1fr 110px;gap:10px;align-items:center;transition:border-color .4s, box-shadow .4s}
.row.sel .card{border-color:#4a5d78}
.rank{font-size:22px;font-weight:800;color:var(--muted);text-align:center}
.row:first-child .rank{color:var(--accent)}
.name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{margin-top:3px;display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--chip);border-radius:999px;padding:0 9px;font-size:12px;line-height:20px}
.chip.new{background:var(--chipnew);color:#1b1206;font-weight:700;animation:pop .7s ease}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.bar{height:6px;background:#222b36;border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb703,#ff5d5d);border-radius:3px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar i.zero{background:#3b4a5e}
.score{text-align:right}
.score .v{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.score .d{font-size:13px;color:var(--hot);font-weight:700;height:18px}
.badge{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-left:6px;vertical-align:2px;font-weight:600}
.badge.none{background:#4a1d1d;color:#ff9a9a}
.badge.half{background:#4a3a1d;color:#ffd08a}
.badge.lane{background:#1d3a2c;color:#8fe0b5}
.badge.hubb{background:var(--accent);color:#1b1206}
.merged{font-size:12px;color:var(--accent2);margin-left:6px}
.row.jump .card{border-color:var(--hot);box-shadow:0 0 0 2px rgba(255,93,93,.35),0 0 28px rgba(255,93,93,.35);animation:shake .6s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.formula{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev h3{margin:0 0 4px;font-size:16px}
.ev .why{font-size:13px;color:var(--muted);margin-bottom:10px}
.ev ol{margin:0;padding:0;list-style:none;max-height:520px;overflow:auto}
.ev li{border-left:3px solid var(--line);padding:6px 10px;margin-bottom:8px;font-size:13.5px;background:var(--panel2);border-radius:0 6px 6px 0}
.ev li.new{border-left-color:var(--chipnew);animation:pop .6s ease}
.ev li .src{font-size:11.5px;color:var(--muted)}
.ev li .k{font-size:11px;background:var(--chip);border-radius:4px;padding:0 5px;margin-right:4px}
footer{padding:4px 28px 24px;color:var(--muted);font-size:12.5px}
.empty{color:var(--muted);padding:40px 10px;text-align:center}

.tabs{display:flex;gap:6px;padding:10px 28px 0;border-bottom:1px solid var(--line)}
.tabs button{border-radius:8px 8px 0 0;border-bottom:none;background:transparent;color:var(--muted);padding:8px 16px}
.tabs button.on{background:var(--panel);color:var(--text);border-color:var(--line)}
[hidden]{display:none!important}
.tab2{grid-template-columns:minmax(0,1fr)}
.tab3{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.tab4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1100px){.tab2,.tab3,.tab4{grid-template-columns:1fr}}
.roles{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:13px}
.role{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel2)}
.role b{display:block;font-size:14px}
.role.fixer{border-color:#7a5a12}
.role.eval{border-color:#2f6b52}
.role.human{border-color:#4a5d78}
.arrow{color:var(--muted)}
.mer{background:#fff;border-radius:8px;padding:8px;overflow-x:auto;margin-bottom:10px}
.mer h4{margin:0 0 4px;color:#333;font-size:13px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600}
.st{font-size:11.5px;border-radius:4px;padding:1px 6px;white-space:nowrap;font-weight:700}
.st.needs_answer{background:#4a1d1d;color:#ff9a9a}
.st.draft{background:#4a3a1d;color:#ffd08a}
.st.approved{background:#1d3a2c;color:#8fe0b5}
.q{background:var(--panel2);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:8px 10px;margin-bottom:8px}
.q .to{font-size:12px;color:var(--muted)}
.round{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.round .v{font-weight:700}
.round .v.ng{color:var(--hot)} .round .v.ok{color:var(--ok)}
.iss{color:var(--muted);margin:2px 0 0 0;padding-left:16px}
.verdict{font-size:30px;font-weight:800;margin:4px 0 8px}
.verdict.差し戻し{color:var(--hot)} .verdict.条件つき合格{color:var(--accent2)} .verdict.合格{color:var(--ok)}
.fd{border-left:3px solid var(--line);padding:6px 10px;margin-bottom:8px;background:var(--panel2);border-radius:0 6px 6px 0;font-size:13px}
.fd.重大{border-left-color:var(--hot)} .fd.中{border-left-color:#ffb703} .fd.条件{border-left-color:#c9a227} .fd.軽{border-left-color:#3b4a5e}
.fd .sev{font-weight:800;margin-right:6px}
.fd .cond{color:var(--accent2);font-size:12.5px;margin-top:3px}

.lanesbox{margin-bottom:12px;overflow-x:auto}
.lanesbox h4{margin:0 0 6px;font-size:13px;color:var(--muted)}
.sl{display:grid;gap:3px;min-width:720px;font-size:11px}
.sl .ln{background:var(--chip);border-radius:4px;padding:4px 6px;font-weight:700;display:flex;align-items:center}
.sl .ln.p{background:#5a4310;color:#ffe08a}
.sl .tk{background:#24303d;border:1px solid #34445a;border-radius:4px;padding:3px 4px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.sl .tk.p{background:#3f3210;border:1px dashed #ffb703;color:#ffe08a}
.sl .gap{border-bottom:1px dotted #222c38}
.critic{border:1px solid #2f6b52;background:#13241c;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:12.5px}
.critic b{color:#8fe0b5}
.critic .src{color:var(--muted)}
.badge.crit{background:#1d3a2c;color:#8fe0b5}
.chip.unnamed{background:transparent;border:1px dashed #4a5d78;color:var(--muted)}

.steps li{cursor:pointer}
.steps li:hover{background:var(--panel2)}
.steps li.viewing{outline:1px solid var(--accent)}
.steps li .who{display:flex;flex-direction:column;flex:1;min-width:0}
.steps li .who small{font-size:11px;color:var(--muted)}
.steps li .open{font-size:11.5px;color:var(--muted)}
.tx{max-height:600px;overflow:auto;font-size:13px;line-height:1.65}
.tl{display:flex;gap:8px;padding:2px 4px;border-radius:4px}
.tl .ln{color:var(--muted);font-size:11px;min-width:22px;text-align:right;padding-top:2px}
.tl.ask{color:var(--muted)}
.tl.cited{background:#3f3210;color:#ffe08a}

.fhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.big2{font-size:18px!important;color:var(--text)!important;margin:0!important}
.fstat{font-size:12.5px;border-radius:6px;padding:3px 10px;font-weight:700}
.fstat.wait{background:#3a2a10;color:var(--accent2);border:1px solid #6b4b14}
.fstat.ok{background:#1d3a2c;color:#8fe0b5}
.fstat.flag{background:#2a2f3a;color:#c9d4e3;border:1px dashed #4a5d78}
.fsub{color:var(--muted);font-size:13px;margin:6px 0 12px}
.lanesbox.big .sl{font-size:12.5px}
.lanesbox.big .sl .tk{padding:6px 6px}
.before{margin-top:18px;opacity:.85}
.lanesbox.small .sl{font-size:10px;min-width:600px}
details.rounds{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.rounds summary{cursor:pointer;color:var(--muted);font-size:13px;margin-bottom:8px}
.ans{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.ans .atext{color:#8fe0b5}
.ans .ameta{font-size:12px;color:var(--muted)}
.ans code{font-size:11.5px;background:var(--chip);border-radius:4px;padding:1px 5px}
.ansmark{font-size:11px;color:#8fe0b5;margin-top:3px}
.qfoot{font-size:12.5px;color:var(--muted)}

.inrow{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--panel2)}
.inlabel{font-size:13px;font-weight:700;margin-bottom:4px}
.inbtn{background:var(--accent);color:#1b1206;border-color:var(--accent);font-weight:700;width:100%}
.insum{font-size:12px;color:var(--muted);cursor:pointer;display:flex;justify-content:space-between}
.insum:hover{color:var(--text)}
.lgi{border-bottom:1px solid var(--line);padding:6px 0;font-size:13px}

.badge.newb{background:var(--accent);color:#1b1206}
.badge.oldb{background:#2a2f3a;color:#c9d4e3}
tr.oldrow td{color:var(--muted)}
.lgsum{font-size:13px;margin:-4px 0 10px;color:var(--muted)}
.lgsum b{color:var(--accent2)}
</style>
</head>
<body>
<header>
  <h1><b>anmoku</b> 定義されていない役割の仮説</h1>
  <span class="sub" id="title"></span>
  <span class="hyp">表示はすべて仮説です。確かめるのは次のヒアリングです</span>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="t1" class="on">① ハブの発見</button>
  <button data-tab="t2">② フロー図</button>
  <button data-tab="t3">③ 定義台帳と質問</button>
  <button data-tab="t4">④ 設計書の判定</button>
</nav>
<main id="t1" class="tab">
  <section class="panel">
    <h2>入力</h2>
    <div class="inrow"><div class="inlabel">業務フロー（今あるもの）</div>
      <button class="inbtn" id="loadFlow">読み込む</button><div class="insum" id="sumFlow" hidden></div></div>
    <div class="inrow"><div class="inlabel">定義台帳（今あるもの）</div>
      <button class="inbtn" id="loadLedger">読み込む</button><div class="insum" id="sumLedger" hidden></div></div>
    <div class="inrow"><div class="inlabel">ヒアリング記録</div>
      <button class="inbtn" id="load">読み込む</button></div>
    <ol class="steps" id="steps" hidden></ol>
    <div class="btns" id="btns" hidden>
      <button id="prev">◀ 戻る</button>
      <button class="primary" id="next">次の人を追加 ▶</button>
      <button id="reset">最初から</button>
    </div>
    <div class="lanes"><div>公式フローのレーン</div><div id="lanes"></div></div>
  </section>
  <section>
    <div class="stagehead"><span class="big" id="stageTitle">0人目</span><span class="muted" id="stageSub"></span></div>
    <div id="board"></div>
  </section>
  <section class="panel ev" id="ev"><div class="empty">読み込んだものを選ぶと、ここに中身が出ます</div></section>
</main>
<main id="t2" class="tab tab2" hidden></main>
<main id="t3" class="tab tab3" hidden></main>
<main id="t4" class="tab tab4" hidden></main>
<footer>
  点数 ＝ フローに無い度合い（レーンあり 0／タスク名だけ 0.5／どこにも無い 1）×（話した人数×2 ＋ 確認・相談・判断などの件数 ＋ 待ちの件数×1.5）。
  引用はすべて原文と文字列で照合済み（<span id="q"></span>）。ここに出るのは「役割を定義し、支える」ための仮説で、個人の評価ではありません。
</footer>

speakers": 3, "deps": 6, "waits": 3, "score": 0.0, "formula": "0.0 ×（3人×2 ＋ 依存6 ＋ 待ち3×1.5）＝ 0.0", "hub_hypothesis": false, "reason": "見積・契約書・値引きの承認者で、工事の中身は分からず別の人に回す。複数話者で一致。", "merged_from": [], "prev_score": 0.0, "new_aliases": [], "evidence": [{"interview": "01_sales_junior", "line": 16, "quote": "金額が一定より大きいのとか、値引きが入るやつは店長の承認が要るんです", "kind": "承認", "target": "店長"}, {"interview": "01_sales_junior", "line": 28, "quote": "夕方まとめて見る感じなので、そこでまた半日待つことはあります", "kind": "待ち", "target": "店長"}, {"interview": "01_sales_junior", "line": 30, "quote": "店長に「これ相談した？」って聞かれることもあるんですよ", "kind": "確認", "target": "店長"}, {"interview": "01_sales_junior", "line": 34, "quote": "契約書作って、店長の承認もらって", "kind": "承認", "target": "店長"}, {"interview": "01_sales_junior", "line": 40, "quote": "古いほうを店長に承認に出しちゃって、店長に差し戻されたことがあります", "kind": "差し戻し", "target": "店長"}, {"interview": "04_sales_senior", "line": 33, "quote": "店長は、契約書に判子もらうときに見てもらいます。", "kind": "承認", "target": "店長"}, {"interview": "04_sales_senior", "line": 35, "quote": "どっちかが休みだと、まあ止まりますよね。", "kind": "待ち", "target": "店長"}, {"interview": "03_genba", "line": 36, "quote": "工事の中身のことは「そっちで聞いて」ってなることが多い", "kind": "相談", "target": "店長"}], "new_evidence": [{"interview": "04_sales_senior", "line": 33, "quote": "店長は、契約書に判子もらうときに見てもらいます。", "kind": "承認", "target": "店長"}, {"interview": "04_sales_senior", "line": 35, "quote": "どっちかが休みだと、まあ止まりますよね。", "kind": "待ち", "target": "店長"}], "unnamed": 0}]}], "inputs": {"flow": [{"lane": "営業", "owner": "営業担当", "task": "問い合わせ受付", "note": ""}, {"lane": "営業", "owner": "営業担当", "task": "現地調査", "note": ""}, {"lane": "営業", "owner": "営業担当", "task": "見積作成", "note": ""}, {"lane": "営業", "owner": "営業担当", "task": "受注・契約", "note": ""}, {"lane": "店長", "owner": "店長", "task": "見積の最終承認", "note": ""}, {"lane": "店長", "owner": "店長", "task": "値引きの承認", "note": ""}, {"lane": "工務", "owner": "工務担当", "task": "職人の手配", "note": ""}, {"lane": "工務", "owner": "工務担当", "task": "工程表の作成", "note": ""}, {"lane": "現場", "owner": "現場監督", "task": "施工管理", "note": ""}, {"lane": "現場", "owner": "現場監督", "task": "追加工事の見積", "note": ""}, {"lane": "現場", "owner": "現場監督", "task": "完了報告", "note": ""}, {"lane": "経理", "owner": "経理担当（山本課長）", "task": "請求", "note": ""}, {"lane": "経理", "owner": "経理担当（山本課長）", "task": "入金確認", "note": ""}], "flow_file": "flow.md", "ledger": [{"id": "additional-work-estimate", "label": "追加工事の見積", "kind": "term", "definition": "施工中に契約外の工事が必要になったとき、現場監督が作成する見積。", "status": "approved", "owner_hint": "現場監督", "evidence": [], "questions": [], "used_by": [], "note": "みどり住設の既存の定義台帳（架空）。公式の業務フローと社内の決まりから作られたもの"}, {"id": "discount-approval", "label": "値引きの承認", "kind": "rule", "definition": "見積からの値引きは、金額にかかわらず店長の承認を得る。", "status": "approved", "owner_hint": "店長", "evidence": [], "questions": [], "used_by": [], "note": "みどり住設の既存の定義台帳（架空）。公式の業務フローと社内の決まりから作られたもの"}, {"id": "estimate-final-approval", "label": "見積の最終承認", "kind": "rule", "definition": "営業担当が作成した見積は、施主に提出する前に店長が見積システムで承認する。承認の無い見積は提出しない。", "status": "approved", "owner_hint": "店長", "evidence": [], "questions": [], "used_by": [], "note": "みどり住設の既存の定義台帳（架空）。公式の業務フローと社内の決まりから作られたもの"}, {"id": "schedule-sheet", "label": "工程表", "kind": "term", "definition": "工務担当が作成する、現場ごとの職人の手配日と作業の順番を示した表。", "status": "approved", "owner_hint": "工務担当", "evidence": [], "questions": [], "used_by": [], "note": "みどり住設の既存の定義台帳（架空）。公式の業務フローと社内の決まりから作られたもの"}, {"id": "site-survey", "label": "現地調査", "kind": "term", "definition": "営業担当が施主宅を訪問し、採寸・写真撮影・配管や下地の確認を行うこと。見積作成の前に必ず行う。", "status": "approved", "owner_hint": "営業担当", "evidence": [], "questions": [], "used_by": [], "note": "みどり住設の既存の定義台帳（架空）。公式の業務フローと社内の決まりから作られたもの"}]}, "answers": [], "transcripts": {"01_sales_junior": ["# ヒアリング記録：営業（入社2年目） 小林さん", "", "聞き手：今日はよろしくお願いします。まず、普段の一日の流れから聞かせてください。", "小林：あ、はい。えーと、朝は9時前に店に来て、メール見て、問い合わせの電話の折り返しとかからですね。で、午前中に現地調査が入ってることが多いです。", "聞き手：現地調査は一日何件くらいですか。", "小林：うーん、日によるんですけど、1件か2件…多いと3件とか。お風呂とかキッチンだと、採寸して写真撮って、配管の位置見て、みたいな感じで、だいたい1時間ちょっとですかね。", "聞き手：段取りはご自分で組むんですか。", "小林：そうですね、自分で。ただ、お客さんの都合で「やっぱ午後で」とかずれることがけっこうあって。そうすると午後に入れてた見積作業がまるっと押すんですよ。あと、外壁のときはハシゴ積んでかないといけないので、社用車の取り合いがあったりとか。", "聞き手：車の取り合い。", "小林：はい、ホワイトボードに書いて予約するんですけど、書き忘れる人がいて、なんていうか、朝行ったら無いっていう（笑）。まあそれはいいんですけど。", "聞き手：戻ってきてからは見積ですか。", "小林：そうです。見積ソフトで作るんですけど、これがちょっと…なんていうか、使いにくくて。商品のコード入れるときに、メーカーの型番そのままだと出てこなくて、社内の番号で検索しないといけないんですよ。", "聞き手：社内の番号はどこで調べるんですか。", "小林：エクセルの一覧があって、それを横に開いて探す感じです。で、たまにその一覧が古くて、新しい型番が載ってないっていう。そうなると先輩に聞いたり、もう手打ちで単価入れちゃったりしてます。", "聞き手：見積ができたら、そのまま出すんですか。", "小林：金額が一定より大きいのとか、値引きが入るやつは店長の承認が要るんです。店長に見てもらって、ハンコっていうか、システムで承認ボタン押してもらって、それで初めてお客さんに出せる。", "聞き手：値引きはよく頼まれますか。", "小林：頼まれますね、正直けっこう。「もうちょっとなんとかならない？」って。相見積取ってる方だと特に。それで、えーと、店長に上げる前に、いったん課長に聞くんですよ。", "聞き手：店長に上げる前に。", "小林：はい。工事の中身で削れるところがあるかとか、職人さんの手間的にここ下げても大丈夫か、みたいなのを。僕まだそこの感覚が全然なくて。店長に「これ根拠は？」って聞かれたときに答えられないと困るので。", "聞き手：それはどのくらいの頻度ですか。", "小林：週に…2、3回？多い週はもっとかな。値引きの話が出るたびなんで、ばらばらですけど。", "聞き手：相談はどうやって。", "小林：電話か、社内のチャットです。ただ、あの人、日中ほとんど現場回ってるんで、つかまらないことが多くて。チャット送っても、返ってくるのが夕方の5時過ぎとか、もっと遅いときもあります。", "聞き手：そうなると、お客さんへの回答は。", "小林：その日のうちに店長まで通せないんで、翌日になっちゃいますね。お客さんには「明日お電話します」って言うんですけど、まあ、相手によっては「まだ？」って感じになるときもあって。ちょっと気まずいです。", "聞き手：店長の承認自体はすぐもらえるんですか。", "小林：店長は店にいることが多いんで、わりとすぐです。ただ、店長も打ち合わせ入ってたりすると夕方まとめて見る感じなので、そこでまた半日待つことはあります。", "聞き手：なるほど。", "小林：で、店長に「これ相談した？」って聞かれることもあるんですよ。値引きのやつは。だから、なんか、聞いとかないと出しにくいっていうか。先輩もみんなそうしてるって言ってたし。", "聞き手：先輩方も同じように。", "小林：たぶん。僕が入ったときに「値引きはまず聞いときな」って言われたんで。誰に聞くかって決まりがあるのかは、よくわかんないですけど。", "聞き手：受注した後の流れはどうですか。", "小林：契約書作って、店長の承認もらって、あとは工務の人に引き継ぎですね。職人さんの手配とかは工務がやってくれるので、僕は日程の調整でお客さんとの間に入るくらいで。", "聞き手：請求まわりは営業も関わりますか。", "小林：ちょっとだけ。あ、そうだ、前に一回、請求書の但し書きがわかんなくて、経理の山本課長に聞きに行ったことがあって。追加工事が出た案件で、元の契約と分けて書くのか一緒にするのか、っていう。", "聞き手：どうなりましたか。", "小林：分けて書いてって言われて、書き方の見本もらいました。それ以来はその見本見ながらやってます。あれは助かりました。", "聞き手：ほかに、日々の作業で手間だなと思うところはありますか。", "小林：うーん…やっぱり見積ソフトですかね。修正すると版が増えていくんですけど、どれが最新かわかりにくくて。一回、古いほうを店長に承認に出しちゃって、店長に差し戻されたことがあります（笑）。", "聞き手：承認のやり直しになったんですね。", "小林：そうです。それでまた半日くらい。あと、現地調査の写真をソフトに取り込むのも、スマホから一回パソコンに送って、っていう二度手間で。地味に時間取られますね。", "聞き手：最後に、何かあればどうぞ。", "小林：えーと…値引きの相談は、できれば午前中に返事もらえると、その日のうちに店長まで回せるんですけどね。まあ、現場優先なのはわかってるので、しょうがないかなとは思ってます。", "聞き手：ありがとうございました。", "小林：ありがとうございました。"], "02_koumu": ["# ヒアリング記録：工務担当 高橋さん", "", "聞き手：今日はよろしくお願いします。まず朝の流れから教えてもらえますか。", "高橋：はい、えーと、朝は大体7時半くらいに来て、まずホワイトボード見て、昨日の現場の進み具合をざっと確認するんですよ。で、監督さんたちから夜のうちにLINE来てたりするんで、それも見て。", "聞き手：なるほど。", "高橋：で、そのあと職人さんの割り振りなんですけど、これは自分じゃ決めないんですよね。佐藤さんに、今日このクロス屋さんはこっち、大工さんはこっち、みたいに決めてもらって、それから工程表を作る感じで。", "聞き手：決めてもらうのは毎朝ですか。", "高橋：毎朝ですね、ほぼ。うん。で、それが出ないと工程表が出せないんで、監督さんたちも「まだですか」って言ってくるんですけど、いや、まだなんですよって。", "聞き手：大体何時くらいに決まるんですか。", "高橋：早いときは8時前に決まるんですけど、えー、現場直行の日とかだと、電話で聞くことになるんで、9時過ぎることもありますね。週に…2回くらい？いや、もうちょっとあるかな。", "聞き手：その間は。", "高橋：その間はもう、なんていうか、仮で組んでおくんですよ。たぶんこうだろうなって。でも結構ひっくり返るんで、作り直しになるときもあって。まあ、しょうがないんですけど。", "聞き手：ひっくり返るのはどういうときですか。", "高橋：えーと、一番多いのは「優先」のお客さんですね。前から付き合いのあるお客さんとか、紹介で来たお客さんは、優先で回せって言われてるんですよ。腕のいい職人さんを先にそっちに付けるとか。", "聞き手：その優先のお客さんは、どうやって分かるんですか。", "高橋：それがですね、一覧とかは無いんですよ。営業さんに聞けば「あ、あそこはOBさんです」とか教えてくれるんですけど、全部の案件でいちいち聞くわけにもいかないし。", "聞き手：ふむ。", "高橋：だから自分は普通の順番で組んで持っていくと、「いや、ここは紹介だから先」って言われて、あ、そうなんですかって。こっちは知らなかったんで。で、組み直し、みたいな。", "聞き手：そういうのはどれくらいの頻度で。", "高橋：うーん、月に何回か…いや、時期によるかな。春先とか、年末前とか、工事が詰まってるときは結構ありますね。暇なときはそもそも取り合いにならないんで。", "聞き手：職人さんの側の都合はどうですか。", "高橋：あー、それもありますね。職人さんって基本一人親方の人が多いんで、他の会社の仕事も入ってるんですよ。だから「来週の火曜は空いてる」って言ってたのに、前の日の夜に「ごめん、向こうが延びた」って電話来たりとか。", "聞き手：その場合は。", "高橋：その場合は、代わりの人探すんですけど、えーと、自分が知ってる範囲で電話かけて、空いてる人いたら、でもその人を入れていいかはまた確認しないといけなくて。勝手に入れると後で言われるんで。", "聞き手：確認が要るんですね。", "高橋：そうですね、特に水回りは、この職人さんじゃないと、みたいなのがあるみたいで。自分もなんとなくは分かってきたんですけど、全部は分かんないですね。", "聞き手：雨の日はどうなりますか。", "高橋：雨は、もう、外壁が一番困るんですよね。塗装とか足場とか。前の日の天気予報見て、明日たぶん無理だなってなったら、職人さんに連絡して、振替の日を決めて、お客さんにも連絡して。", "聞き手：お客さんへの連絡は高橋さんが。", "高橋：お客さんへは監督さんか営業さんですね。自分は日にちの候補出すまで。でも候補出すのにも、その日空いてる職人さんがいるかってなるんで、また調整で。", "聞き手：振替はすんなり決まりますか。", "高橋：いや、梅雨とか秋の長雨のときは、一個ずれると後ろが全部ずれるんですよ。玉突きみたいに。で、その玉突きのどこを先にするかって、結局また聞かないと決められなくて。", "聞き手：うん。", "高橋：あのー、お客さんによっては「入居日が決まってる」とか「法事があるから」とかで、絶対ずらせない日があったりするんで。そういうのも、聞いてみないと分からないことが多いですね。", "聞き手：資材の方はどうですか。", "高橋：資材はですね、えー、ユニットバスとかキッチンとか、メーカーの納期がもう読めないことがあって。前は2週間って言われてたのが、急に4週間になったりとか。", "聞き手：それが分かるのはいつですか。", "高橋：発注してから、メーカーさんから回答が来て分かるんで、受注してから1週間くらい経ってからとかですかね。で、そこで工程組み直し。職人さんもその日で押さえちゃってたりするんで、また連絡して。", "聞き手：職人さんにはなんて。", "高橋：「すいません、物が来ないんで」って。まあ慣れてる人は「あー、またか」って感じですけど、若い人だと他の仕事入れちゃって、次いつ空くか分かんないってなることもあって。", "聞き手：大変ですね。", "高橋：いやまあ、どこもそうだと思うんですけど。あ、あと、細かいのだとコーキング材とか、クロスの品番が廃番になってたとか。それは現場入ってから分かったりもするんで、もう、その場で決めてもらうしかないですね。", "聞き手：工程表は最終的にどう出してるんですか。", "高橋：エクセルですね。週単位のやつと、日ごとのやつ。で、決まったら印刷してボードに貼って、監督さんたちのグループLINEにも写真で送ってます。", "聞き手：それで一日の段取りは終わりですか。", "高橋：いや、昼過ぎにまた変更来たりするんで、そこからまた直して。夕方に翌日の分を一回仮で組んで、明日の朝に佐藤さんに見てもらうっていう。だから、結局毎朝そこ待ちなんですよね。", "聞き手：ありがとうございます。最後に何かあれば。", "高橋：うーん、まあ、優先のお客さんがどこなのかだけでも、最初から分かってれば、組み直しは減るかなって思いますけど。あと雨は…雨はどうしようもないですね（笑）。", "聞き手：ありがとうございました。"], "03_genba": ["# ヒアリング記録：現場監督 中村さん", "", "聞き手：今日はよろしくお願いします。まず、普段の一日の流れから聞かせてもらえますか。", "中村：あ、はい。えーと、朝はだいたい七時半くらいに事務所に寄って、その日回る現場の資材とか確認して、それから現場ですね。多いときで三つ、四つ回ります。", "聞き手：一日で四つですか。", "中村：まあ、水回りの小さいのが重なると、そのくらいは。外壁とかだと足場の日はずっと張りついてることもありますけど。", "聞き手：現場ではどんなことを。", "中村：職人さんへの段取りの確認と、あと写真ですね。着工前、解体後、下地、仕上げって、それぞれ撮ってクラウドに上げるんですけど、これが地味に時間かかるんですよ。", "聞き手：写真の報告は毎日ですか。", "中村：うーん、毎日っていうか、工程が変わるたびですね。忘れると事務所から「上がってないよ」って言われるんで、昼休みに車の中でまとめて上げたりしてます。電波悪い現場だと、もう夜に家から、とか。", "聞き手：なるほど。職人さんとのやりとりはどうですか。", "中村：職人さんはね、長い付き合いの人が多いんで、そこはわりと楽なんです。大工の親方なんかは、こっちが言う前に「中村さん、ここ根太腐ってるよ」って教えてくれたりして。", "聞き手：そういうとき、どうなるんですか。", "中村：それがですね、まあ、追加工事になるんですよね。床めくったら下地がダメだったとか、壁の中の配管が古くて替えたほうがいいとか。そういうのが、なんていうか、現場ごとにだいたい一回はあります。", "聞き手：一回は。", "中村：ええ、ない現場のほうが珍しいかな。古い家が多いんで。", "聞き手：追加が出たときは、どう進めるんですか。", "中村：まず統括に確認します。進めていいかどうか。電話かLINEで、写真つけて「こういう状態なんですけど」って送って。", "聞き手：返事はすぐ来ますか。", "中村：うーん……来るときは来ます。でも統括も現場出てたり、打ち合わせ入ってたりするんで、一時間とか、ひどいと半日とか。その間、施主さんには「ちょっと確認しますね」って言って待ってもらう感じで。", "聞き手：施主さんの反応は。", "中村：まあ、いい顔はされないですよね。だって目の前で床が開いてるわけですから。「で、どうするの？」って。職人さんも手が止まるし、親方なんかは「じゃあ先に向こうやっとくわ」って別の作業に回ってくれるんですけど、それも毎回お願いするのは悪いなあって。", "聞き手：判断を待つ間、ほかにできることは。", "中村：うーん、できることはやりますけど、結局そこが決まらないと次に進めないことが多いんで。給湯管なんかだと、替えるか替えないかで床の納まりが変わっちゃうし。", "聞き手：追加の金額によって、やり方は変わりますか。", "中村：あ、それはあります。十万を超えそうなときは、施主さんに言う前に一声かけるっていう。", "聞き手：それは決まりになっている？", "中村：うーん、決まり……なんですかね。どこかに書いてあるわけじゃないんですけど、みんなそうしてます。僕も入ったときに先輩から「十万超えそうだったら先に言っとけよ」って言われて、それからずっと。", "聞き手：十万以下だと。", "中村：小さい追加なら現場で決めていいって言われてるんです。言われてるんですけど、その「小さい」がどこまでなのか、正直よくわかんなくて。", "聞き手：たとえば、どんな場合ですか。", "中村：たとえば、コンセント一個増やすとか、巾木をちょっと延ばすとか、そのくらいなら僕もその場で「やりますよ」って言っちゃいます。三万とか五万とかなら、まあいいかなって。でも八万とか九万になってくると、うーん……ってなるじゃないですか。", "聞き手：迷ったときは。", "中村：迷ったら、結局聞いちゃいます。あとで「なんで勝手に決めたの」って言われるのも嫌なんで。前に一回、七万くらいのを現場で決めたら、粗利がどうとかで経理の山本課長から確認が来て、ちょっと焦ったことがあって。それ以来、ちょっとでも怪しいと思ったら聞くようにしてます。", "聞き手：店長に相談することは？", "中村：うーん、店長はどっちかっていうと営業寄りなんで、工事の中身のことは「そっちで聞いて」ってなることが多いですね。結局、佐藤さんじゃないと決められないんですよ。", "聞き手：ほかの監督さんも同じような感じですか。", "中村：たぶん同じだと思います。同じ日にみんなから連絡が行ってるんじゃないかな。たまに返事が来ないなと思って事務所に電話したら、「今ほかの人の件で話してるよ」って言われたりとか。", "聞き手：施主さんへの説明はどうしていますか。", "中村：施主さんには、OKが出てから見積の金額をざっくり伝えて、正式なのは営業さんに作ってもらって、あとで出してもらう感じです。でも施主さんからすると、その場で金額知りたいんですよね。「だいたいでいいから」って。そこで言っちゃうと、あとで変わったときに揉めるんで、言えないこともあって。", "聞き手：揉めたことはありますか。", "中村：一回ありました。浴室のときに、だいたい六万って言ったら、営業さんが作った見積が八万ちょっとになってて。施主さんに「最初と違うじゃない」って言われて。まあ、最後は分かってもらえましたけど、あれはしんどかったですね。", "聞き手：そういう追加の記録はどこに残していますか。", "中村：写真と一緒にクラウドにメモを書いておくのと、あと僕の手帳ですね。LINEのやりとりも残ってはいるんですけど、あとから探すのは大変で。引き渡しのときに「この追加はいつ決めたっけ」ってなって、スクロールしまくったりしてます。", "聞き手：最後に、何か困っていることがあれば。", "中村：うーん、困ってること……まあ、待ってる時間ですかね。施主さんと職人さんの間に立って、どっちにも「すいません、ちょっと待ってください」って言ってる時間。あれがなくなったら、だいぶ楽だなって思います。", "聞き手：ありがとうございました。", "中村：いえいえ、こんな話でよかったんですかね。"], "04_sales_senior": ["# ヒアリング記録：営業（ベテラン） 伊藤さん", "", "聞き手：今日はよろしくお願いします。まず、問い合わせが来てからの流れを教えてもらえますか。", "伊藤：はい、えーと、電話か、ショールームに来られるか、最近はホームページのフォームも多いですね。で、だいたい一週間以内には現地を見に行くようにしてます。", "聞き手：現地調査は伊藤さんお一人で？", "伊藤：基本は一人です。外壁とか大きいのだと工務の人に一緒に来てもらうこともあるけど、まあ、たまにですね。水回りなんかは自分で測って写真撮って、帰ってきて見積作る感じ。", "聞き手：見積はどれくらいで出されてますか。", "伊藤：普通の物件なら、うーん、二日か三日。早ければ翌日に出すこともありますよ。お客さんも比べてるんで、早いほうがいいのは分かってるんです。", "聞き手：普通じゃない物件もある？", "伊藤：ありますね。築四十年とか、前に別の業者さんが何回も手入れてる家とか。そういうのは、なんていうか、床めくってみないと分からないんですよ。土台が傷んでるとか、配管が変な回し方してあるとか。", "聞き手：そういうときはどうされてるんですか。", "伊藤：統括に聞きます。これ、いくら乗せときます？って。写真見せて、築年数言って。そうすると「じゃあ十五万見とこうか」とか言ってくれるんで、それを予備費みたいな形で入れる。", "聞き手：聞くのはどのタイミングで。", "伊藤：いや、それがね、向こうも現場回ってて昼間ほぼいないんですよ。夕方戻ってきたところを捕まえるか、LINEで写真送っとくか。で、返事が次の日とか、その次とか。", "伊藤：だから難しい物件だと、見積が二、三日は余計にかかっちゃう。", "聞き手：お客さんから催促は？", "伊藤：たまに。「まだですか」って。そういうときは、もうちょっと詳しく調べてますんで、って言ってますけど。まあ、嘘じゃないです（笑）。", "聞き手：その「難しい物件」っていうのは、どう判断されてるんですか。", "伊藤：えー……どうだろう。築年数が古いとか、増築してるとか、あとは、なんか、見て嫌な感じがする家（笑）。床がちょっとふかふかしてるとか。", "伊藤：うちでは「難あり」って言ったりしますけど、何年以上とか決まってるわけじゃないですね。", "聞き手：ほかの営業さんも同じ感覚ですか。", "伊藤：どうなんですかね。若い子は、たぶん全部聞きに行ってると思う。逆に聞かないで出しちゃって、あとで追加になって揉めたこともあったかな。去年だったか、一件。", "聞き手：若手の方にはどう教えてるんですか。", "伊藤：教えるっていうか、現調に連れてって、ここ見ろよって言うくらいですね。押し入れの奥とか、床下点検口あったら開けるとか。あとは場数ですよ、正直。私も最初はそうだったし。", "聞き手：値引きの話も伺いたいんですが。", "伊藤：あー、値引きね。うちは結構言われますよ、地元なんで。ほかの会社はいくらだったとか。で、まあ、粗利見て、このくらいまでなら大丈夫かなっていうのは、自分の中であるんです。", "聞き手：目安みたいなものが。", "伊藤：うん、なんとなく。ざっくり言うと、二割五分くらい残ってればいいかな、とか。でもそれも工事の中身によるし、外壁なんかだと足場代がでかいから、また違うんですけど。", "聞き手：それを超えそうなときは？", "伊藤：課長に一声かけます。「これ、ここまで引いていいですか」って。だいたい「まあいいよ」って言ってくれるけど、たまに「それはやめとけ」って。", "伊藤：昔からそういうもんなんで、あんまり疑問に思ったことないですね。", "聞き手：店長の承認というのは。", "伊藤：店長は、契約書に判子もらうときに見てもらいます。金額と、値引きいくらかと。ただ店長は工事の細かいとこまでは分からないって本人も言ってるんで、先に話が通ってるなら、ってだいたい通りますね。", "聞き手：順番としては、そちらの確認が先なんですね。", "伊藤：そうそう。先に聞いとかないと、店長に何か聞かれたとき答えられないんで。だから、どっちかが休みだと、まあ止まりますよね。店長が会議でもう一つの店に行ってる日とかもあるし。", "聞き手：ショールームの集客についてはどうですか。", "伊藤：週末はそこそこ来ますよ。イベントやると、キッチンの展示の前にね、家族連れが。ただ見に来るだけの人も多いんで、そこから現調まで行くのは、うーん、半分もないかな。三割とか、そのくらい？", "聞き手：週末は営業さんが対応されるんですか。", "伊藤：交代でね。土日どっちか出る感じ。で、週末に現調の予約が固まると、月曜火曜に見積が集中するんですよ。そこに難ありの物件が重なると、聞きに行く件数が増えて、向こうも大変だと思いますよ。", "聞き手：そのときはどうされてます？", "伊藤：まとめて夕方に持っていきます。三件くらい写真並べて。統括も慣れてるから、ぱっぱっと見て「これは十万、これは大丈夫」って。見るのは早いんです。捕まえるのが大変なだけで（笑）。", "聞き手：最後に、何か困っていることがあれば。", "伊藤：困ってる、うーん……まあ、もうちょっと早く見積出せたら取れた仕事もあったかな、とは思いますね。相見積で、先に出したとこに決まっちゃったとか。", "伊藤：でもしょうがないですよ、開けてみないと分かんないもんは分かんないんで。", "聞き手：ありがとうございました。"]}, "flows": {"before": [{"lane": "営業", "owner": "営業担当", "task": "問い合わせ受付", "note": ""}, {"lane": "営業", "owner": "営業担当", "task": "現地調査", "note": ""}, {"lane": "営業", "owner": "営業担当", "task": "見積作成", "note": ""}, {"lane": "営業", "owner": "営業担当", "task": "受注・契約", "note": ""}, {"lane": "店長", "owner": "店長", "task": "見積の最終承認", "note": ""}, {"lane function badge(c){
  const hub = (c.hub_hypothesis ? `<span class="badge hubb">ハブの仮説</span>` : "") + (c.critique ? `<span class="badge crit">${c.critique.still_hub ? "反証役を経ても残る" : "反証役が取り下げ"}</span>` : "");
  return hub + absBadge(c);
}
function absBadge(c){
  if (c.absence >= 1) return `<span class="badge none">フローに無い</span>`;
  if (c.absence > 0) return `<span class="badge half">タスク名だけ</span>`;
  return `<span class="badge lane">レーンあり</span>`;
}

function countUp(el, from, to){
  const t0 = performance.now(), dur = 900;
  function f(t){ const p = Math.min(1, (t - t0) / dur); const e = 1 - Math.pow(1 - p, 3);
    el.textContent = (from + (to - from) * e).toFixed(1).replace(/\.0$/, ""); if (p < 1) requestAnimationFrame(f); }
  requestAnimationFrame(f);
  setTimeout(() => { el.textContent = String(to); }, dur + 80);
}

function renderBoard(forward){
  const board = $("board");
  if (k === 0){
    board.innerHTML = allLoaded()
      ? `<div class="empty">今ある業務フロー・定義台帳と、${DATA.interviews.length}人分のヒアリング記録を読み込みました。<br>左の項目を選ぶと中身が読めます。「次の人を追加」で、1人目から分析の結果を見ます</div>`
      : `<div class="empty">左の「入力」で、業務フロー・定義台帳・ヒアリング記録を読み込んでください</div>`;
    $("stageTitle").textContent = "0人目"; $("stageSub").textContent = "";
    if (!viewing) $("ev").innerHTML = `<div class="empty">読み込んだものを選ぶと、ここに中身が出ます</div>`;
    return;
  }
  const st = DATA.stages[k - 1];
  $("stageTitle").textContent = `${k}人目まで`;
  $("stageSub").textContent = `＋ ${st.added.title.replace("ヒアリング記録：", "")}`;
  const keep = new Set(st.candidates.map(c => c.key));
  [...board.querySelectorAll(".row")].forEach(r => { if (!keep.has(r.dataset.key)) r.remove(); });
  board.querySelector(".empty")?.remove();
  board.style.height = (st.candidates.length * ROW_H) + "px";
  st.candidates.forEach((c, i) => {
    let row = board.querySelector(`.row[data-key="${c.key}"]`);
    const isNew = !row;
    if (isNew){
      row = document.createElement("div"); row.className = "row"; row.dataset.key = c.key;
      row.style.transform = `translateY(${(st.candidates.length + 1) * ROW_H}px)`; row.style.opacity = 0;
      row.addEventListener("click", () => { selected = c.key; viewing = null; renderSteps(); renderEvidence(); markSel(); });
      board.appendChild(row);
    }
    const oldScore = forward ? (c.prev_score || 0) : c.score;
    const delta = c.score - (c.prev_score || 0);
    const pct = Math.max(2, 100 * c.score / DATA.max_score);
    row.innerHTML = `<div class="card">
      <div class="rank">${i + 1}</div>
      <div style="min-width:0">
        <div class="name">${esc(c.name)} ${badge(c)}${c.merged_from.length ? `<span class="merged">⇐ ${esc(c.merged_from.join("・"))} をまとめた</span>` : ""}</div>
        <div class="chips">${Object.entries(c.aliases).map(([a, n]) =>
          `<span class="chip ${forward && c.new_aliases.includes(a) && k > 1 ? "new" : ""}">${esc(a)} ×${n}</span>`).join("")}${c.unnamed ? `<span class="chip unnamed" title="相手が名指しされていない発言。文脈からこの相手と推定し、点数の件数に含めている">名指しなし ${c.unnamed}件</span>` : ""}</div>
        <div class="bar"><i class="${c.score ? "" : "zero"}" style="width:${forward ? Math.max(2, 100 * (c.prev_score || 0) / DATA.max_score) : pct}%"></i></div>
        <div class="formula">${esc(c.formula)}${c.unnamed ? `（件数のうち名指しなし ${c.unnamed}件）` : ""}</div>
      </div>
      <div class="score"><div class="v">${oldScore}</div><div class="d">${forward && delta > 0 && k > 1 ? "+" + (Math.round(delta * 10) / 10) : ""}</div></div>
    </div>`;
    void row.offsetHeight;
    setTimeout(() => {
      row.style.transform = `translateY(${i * ROW_H}px)`; row.style.opacity = 1;
      row.querySelector(".bar i").style.width = pct + "%";
      if (forward) countUp(row.querySelector(".v"), oldScore, c.score);
    }, 30);
    row.classList.toggle("jump", forward && k > 1 && delta >= 5);
  });
  if (!selected || !keep.has(selected)) selected = st.candidates[0]?.key;
  markSel(); renderEvidence(forward);
}

function markSel(){ document.querySelectorAll(".row").forEach(r => r.classList.toggle("sel", r.dataset.key === selected)); }

function renderEvidence(forward){
  const st = DATA.stages[k - 1]; if (!st) return;
  const c = st.candidates.find(x => x.key === selected); if (!c) return;
  const newSet = new Set(c.new_evidence.map(e => e.interview + ":" + e.line + e.quote));
  const name = id => (DATA.interviews.find(iv => iv.id === id)?.title || id).replace("ヒアリング記録：", "");
  $("ev").innerHTML = `<h2>根拠（原文の引用）</h2><h3>${esc(c.name)}</h3>
    <div class="why">${esc(c.absence_reason)}。${esc(c.reason)}</div>
    ${c.critique ? `<div class="critic"><b>反証役の確認：${c.critique.still_hub ? "仮説は残る" : "仮説を取り下げ"}</b>（反証の強さ：${esc(c.critique.strength)}）${c.critique.reasons.map(r => `<div>・${esc(r.reason)}${r.quote ? `<span class="src">　${esc(r.file || "フロー")}${r.line ? ":" + r.line : ""}「${esc(r.quote)}」</span>` : ""}</div>`).join("")}</div>` : ""}
    <ol>${[...c.evidence].sort((a, b) => newSet.has(b.interview + ":" + b.line + b.quote) - newSet.has(a.interview + ":" + a.line + a.quote)).map(e =>
      `<li class="${forward && newSet.has(e.interview + ":" + e.line + e.quote) ? "new" : ""}"><span class="k">${esc(e.kind)}</span>「${esc(e.quote)}」
       <div class="src">${esc(name(e.interview))}　${esc(e.interview)}.md:${e.line}　呼び方：${esc(e.target)}</div></li>`).join("")}</ol>`;
}

function go(nk){ viewing = null; const fwd = nk > k; k = Math.max(0, Math.min(DATA.stages.length, nk)); renderSteps(); renderBoard(fwd); }

function flowStatus(st){
  if (!st) return "";
  if (st.startsWith("人が承認済み")) return `<span class="fstat ok">担当者が承認済み</span>`;
  if (st.startsWith("承認したものとして")) return `<span class="fstat flag">承認したものとして扱った（評価用。担当者の承認ではない）</span>`;
  return `<span class="fstat wait">担当者の確認待ち（AIが足した「仮」の行を含む）</span>`;
}

// ② フロー図：改善後を主役に、改善前は小さく、AI同士のやりとりは折りたたむ
let t2done = false;
function renderTab2(){
  if (t2done) return; t2done = true;
  const el = $("t2"), fx = DATA.fix;
  if (!fx || !DATA.flows?.after) { el.innerHTML = `<section class="panel"><div class="empty">まだフローを修正していません（anmoku fix）</div></section>`; return; }
  el.innerHTML = `<section class="panel">
    <div class="fhead"><h2 class="big2">改善後の業務フロー（仮説）</h2>${flowStatus(fx.status)}</div>
    <div class="fsub">黄色の点線＝AIが語りをもとに「仮」で足した役割と仕事（${fx.added_rows.length}行）。次のヒアリングで本人に確かめ、確かめた行から「仮」を外す</div>
    ${lanesTable("", DATA.flows.after, "big")}
    <div class="before">${lanesTable("改善前（公式の業務フロー）", DATA.flows.before, "small")}</div>
    <details class="rounds"><summary>AIどうしのやりとりを見る（修正役 → 評価役、${fx.rounds.length}往復）</summary>
      <div class="roles"><div class="role fixer"><b>修正役</b>フローのファイルだけ書ける</div><span class="arrow">→</span>
      <div class="role eval"><b>評価役</b>読み取りのみ（Hookで書き込み禁止）</div><span class="arrow">→</span>
      <div class="role human"><b>担当者</b>確認して承認する</div></div>
      ${fx.rounds.map(r => `<div class="round">${r.round}往復目：評価役の確認 → <span class="v ${r.review.verdict.startsWith("直す") ? "ng" : "ok"}">${esc(r.review.verdict)}</span>
        <ul class="iss">${r.review.issues.filter(i => i.severity === "重大").map(i => `<li>[重大・${esc(i.kind)}] ${esc(i.row)}：${esc(i.problem)}</li>`).join("") || "<li>重大な指摘なし</li>"}</ul></div>`).join("")}
    </details>
  </section>`;
}
function lanesTable(title, rows, size){
  const lanes = [...new Set(rows.map(r => r.lane))];
  return `<div class="lanesbox ${size || ""}">${title ? `<h4>${esc(title)}</h4>` : ""}<div class="sl" style="grid-template-columns:120px repeat(${rows.length}, minmax(${size === "small" ? 48 : 64}px, 1fr))">` +
    lanes.map(l => `<div class="ln ${l.includes("仮") ? "p" : ""}">${esc(l)}</div>` + rows.map(r => r.lane === l
      ? `<div class="tk ${r.provisional ? "p" : ""}" title="${esc(r.owner + "：" + r.task + (r.note ? "\n" + r.note : ""))}">${esc(r.task)}</div>` : `<div class="gap"></div>`).join("")).join("") +
    `</div></div>`;
}

// ③ 定義台帳と質問：質問ごとに、答えの記録（anmoku answer）を出す
let t3done = false;
function renderTab3(){
  if (t3done) return; t3done = true;
  const el = $("t3"), lg = DATA.ledger;
  if (!lg) { el.innerHTML = `<section class="panel"><div class="empty">まだ定義台帳を作っていません（anmoku ledger）</div></section>`; return; }
  const ans = DATA.answers || [];
  const findAns = q => ans.find(a => a.ledger_id === q.ledger_id && a.question === q.question);
  const answeredIds = new Set(ans.map(a => a.ledger_id));
  const nNew = lg.items.filter(i => i.origin === "new").length, nOld = lg.items.length - nNew;
  const left = `<section class="panel"><h2>定義台帳（${(lg.hubs || []).length ? esc(lg.hubs.join("・")) + "（ハブの仮説）などが持つ" : ""}判断基準・用語を、根拠つきで並べたもの）</h2>
    <div class="lgsum">今ある台帳 ${nOld}件 ＋ <b>語りから見つかった、台帳に無いもの ${nNew}件</b></div>
    <table class="t"><tr><th>用語・判断基準</th><th>状態</th><th>答えを持つ人（仮説）</th><th>根拠</th></tr>` +
    [...lg.items].sort((a, b) => (a.origin === "new" ? 0 : 1) - (b.origin === "new" ? 0 : 1)).map(it => `<tr class="${it.origin === "new" ? "newrow" : "oldrow"}"><td>${it.origin === "new" ? '<span class="badge newb">台帳に無い</span> ' : '<span class="badge oldb">今ある台帳</span> '}${esc(it.label)}${it.group === "implicit_rule" ? ' <span class="badge half">フローに無い決まり</span>' : ""}</td>
      <td><span class="st ${it.status}">${ST[it.status] || it.status}</span>${answeredIds.has(it.id) && it.status !== "approved" ? '<div class="ansmark">答えあり・承認待ち</div>' : ""}</td><td>${esc(it.owner_hint || "-")}</td>
      <td title="${esc(it.evidence.map(e => e.source + ":" + e.line + " " + e.quote).join("\n"))}">${it.evidence.length}件</td></tr>`).join("") + `</table></section>`;
  const right = `<section class="panel"><h2>次のヒアリングで聞く質問（優先順・5つ）と答え</h2>` +
    lg.questions.map((q, i) => { const a = findAns(q); return `<div class="q"><b>${i + 1}. ${esc(q.question)}</b><div class="to">→ ${esc(q.to)}　対象：${esc(q.label)}</div>
      <div class="ans ${a ? "has" : ""}">${a ? `<div class="atext">答え：${esc(a.answer)}</div><div class="ameta">${esc(a.by)}・${esc(a.date)}／定義の承認は担当者が行う（anmoku approve）</div>`
        : `<div class="ameta">答え：未記録　<code>anmoku answer &lt;案件&gt; ${i + 1} "答え" --by 答えた人</code></div>`}</div></div>`; }).join("") +
    `<div class="qfoot">この5つに答えが出れば、回答待ちが埋まり、エージェント化を判断する条件がそろいます。答えを記録しても定義は自動では承認しません。確かめた担当者が承認します。</div></section>`;
  el.innerHTML = left + right;
}

// ④ 設計書の判定
let t4done = false;
function renderTab4(){
  if (t4done) return; t4done = true;
  const el = $("t4"), rs = DATA.reviews || [];
  const lg = Object.fromEntries((DATA.ledger?.items || []).map(i => [i.id, i]));
  if (!rs.length) { el.innerHTML = `<section class="panel"><div class="empty">まだ設計書を評価していません（anmoku review）</div></section>`; return; }
  el.innerHTML = rs.map(r => `<section class="panel"><h2>別のAIが作った設計書：${esc(r.design)}${r.test_spec ? "＋" + esc(r.test_spec) : ""}</h2>
    <div class="verdict ${r.verdict}">${esc(r.verdict)}</div>
    <div style="color:var(--muted);font-size:13px;margin-bottom:10px">重大${r.counts["重大"]}・中${r.counts["中"]}・条件${r.counts["条件"]}・軽${r.counts["軽"]}　（物差し：${esc(r.flow_basis || "業務フロー")}＋定義台帳。判定の規則はPythonで固定）</div>
    ${r.findings.map(f => `<div class="fd ${f.severity}"><span class="sev">[${f.severity}]</span>観点${f.aspect}　${esc(f.target)} ${esc(f.location)}<br>「${esc(f.design_quote)}」<div>${esc(f.problem)}</div><div class="cond">合格の条件：${esc(f.pass_condition)}</div></div>`).join("")}
    ${r.pending_definitions.length ? `<h2 style="margin-top:12px">合格に残る条件：承認されていない定義 ${r.pending_definitions.length}件</h2>` +
      `<table class="t"><tr><th>定義</th><th>状態</th><th>答えを持つ人（仮説）</th></tr>` + r.pending_definitions.map(id => `<tr><td>${esc(lg[id]?.label || id)}</td><td><span class="st ${lg[id]?.status}">${ST[lg[id]?.status] || "-"}</span></td><td>${esc(lg[id]?.owner_hint || "-")}</td></tr>`).join("") + `</table>` : ""}
  </section>`).join("");
}
const v = location.hash.match(/view=([\w-]+)/); if (v) showTranscript(v[1]);
const tm = location.hash.match(/tab=(\d)/); if (tm) document.querySelector(`#tabs button[data-tab="t${tm[1]}"]`)?.click();
</script>
</body>
</html>
